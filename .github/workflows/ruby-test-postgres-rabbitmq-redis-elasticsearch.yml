name: Ruby Test (Postgres + RabbitMQ + Redis + Elasticsearch)

on:
  workflow_call:
    inputs:
      ruby-version:
        description: Ruby version for setup-ruby. Defaults to the caller's .ruby-version.
        required: false
        type: string
      app-client-id:
        description: GitHub App client ID used to read private gem repositories. Required only when gem-allowlist is set.
        required: false
        type: string
      gem-allowlist:
        description: Newline-delimited private gem repositories the GitHub App token may fetch. Omit for public-only Gemfiles — no token is created and no private access is configured.
        required: false
        type: string
      prepare-database:
        description: Run db:create and db:test:prepare before running specs.
        default: true
        required: false
        type: boolean
    secrets:
      FATSOMA_DEPENDENCIES_APP_PRIVATE_KEY:
        description: GitHub App private key used to read private gem repositories. Required only when gem-allowlist is set.
        required: false
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM:
        description: Token for rubygems.pkg.github.com gem sources. Required only for Gemfiles sourcing from GitHub Packages.
        required: false
      BUNDLE_GEMS__RAILSLTS__COM:
        description: Credentials (username:password) for gems.railslts.com. Required only for Gemfiles sourcing Rails LTS.
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    env:
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.BUNDLE_RUBYGEMS__PKG__GITHUB__COM }}
      BUNDLE_GEMS__RAILSLTS__COM: ${{ secrets.BUNDLE_GEMS__RAILSLTS__COM }}
      CONFIG_PATH: /home/runner/v2-fatsoma-settings
      COVERAGE: "true"
      PAGER: cat
    services:
      # Cohort settings connect as the root role (v2-fatsoma-settings
      # .env.circle); trust auth replicates passwordless local access.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: root
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:4.2.2-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:6.2.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # ES 5.x boots slowly — hence 15 health retries.
      elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:5.6.16
        env:
          xpack.security.enabled: false
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl --fail http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create private-gem token
        if: inputs.gem-allowlist != ''
        id: gem-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.FATSOMA_DEPENDENCIES_APP_PRIVATE_KEY }}
          owner: Fatsoma
          repositories: ${{ inputs.gem-allowlist }}
          permission-contents: read

      - name: Configure private gem access
        if: inputs.gem-allowlist != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.gem-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/Fatsoma/".insteadOf "git@github.com:Fatsoma/"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ inputs.ruby-version != '' && inputs.ruby-version || 'default' }}
          bundler-cache: true

      - name: Distribute settings env files
        shell: bash
        run: |
          mkdir -p "$CONFIG_PATH"
          # Skipped for callers that don't bundle fatsoma-settings.
          if ! SETTINGS_DIR=$(bundle info --path fatsoma-settings 2>/dev/null); then
            echo "fatsoma-settings not in bundle; skipping settings distribution"
            exit 0
          fi
          for env in test development local; do
            cp -v "$SETTINGS_DIR/.env.circle" "$CONFIG_PATH/.env.$env"
          done

      # db:test:prepare guards pending migrations, then loads
      # db/structure.sql (cohort is schema_format :sql).
      - name: Prepare database
        if: inputs.prepare-database
        shell: bash
        run: RAILS_ENV=test bundle exec rake db:create db:test:prepare

      - name: Run specs
        shell: bash
        run: |
          mkdir -p test-results
          bundle exec rspec --format json --out test-results/results.json --format documentation spec

      - name: Write coverage summary
        if: success()
        shell: bash
        run: |
          COVERED=$(ruby -rjson -e 'j = JSON.parse(File.read("coverage/.last_run.json")); puts j.dig("result", "covered_percent") || j.dig(:result, :covered_percent)' 2>/dev/null || echo "n/a")
          echo "total: **${COVERED}%**" >> "$GITHUB_STEP_SUMMARY"

      - name: Show Postgres logs on failure
        if: failure()
        run: docker logs "${{ job.services.postgres.id }}" || true

      - name: Show RabbitMQ logs on failure
        if: failure()
        run: docker logs "${{ job.services.rabbitmq.id }}" || true

      - name: Show Redis logs on failure
        if: failure()
        run: docker logs "${{ job.services.redis.id }}" || true

      - name: Show Elasticsearch logs on failure
        if: failure()
        run: docker logs "${{ job.services.elasticsearch.id }}" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: test-results/
          if-no-files-found: ignore

      - name: Upload coverage + artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
