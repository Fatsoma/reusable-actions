name: Ruby Test (services)

on:
  workflow_call:
    inputs:
      ruby-version:
        description: Ruby version for setup-ruby. Defaults to the caller's .ruby-version.
        required: false
        type: string
      app-client-id:
        description: GitHub App client ID used to read private gem repositories. Required only when gem-allowlist is set.
        required: false
        type: string
      gem-allowlist:
        description: Newline-delimited private gem repositories the GitHub App token may fetch. Omit for public-only Gemfiles — no token is created and no private access is configured.
        required: false
        type: string
      postgres:
        description: Add a postgres:17.9 service (POSTGRES_USER=fatsoma), matching the CircleCI services cohort.
        required: false
        type: boolean
        default: false
      rabbitmq:
        description: Add a rabbitmq:4.2.2-alpine service. Broker-only — no topology is configured (use ruby-integration-rabbitmq.yml for the prescribed fatsoma_test topology).
        required: false
        type: boolean
        default: false
      redis:
        description: Add a redis:3-alpine service, matching the CircleCI services cohort.
        required: false
        type: boolean
        default: false
      elasticsearch:
        description: Add an elasticsearch:5.6.10-alpine service (v2-service-product only in the CircleCI cohort).
        required: false
        type: boolean
        default: false
      db-setup:
        description: "Rails DB preparation before specs: structure-load (db:create db:structure:load), schema-load (db:schema:load), or test-prepare (db:test:prepare — analytics/order variant). Omit when the suite needs no DB setup."
        required: false
        type: string
    secrets:
      FATSOMA_DEPENDENCIES_APP_PRIVATE_KEY:
        description: GitHub App private key used to read private gem repositories. Required only when gem-allowlist is set.
        required: false
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM:
        description: Token for rubygems.pkg.github.com gem sources. Required only for Gemfiles sourcing from GitHub Packages.
        required: false

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    env:
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.BUNDLE_RUBYGEMS__PKG__GITHUB__COM }}
      CONFIG_PATH: /home/runner/v2-fatsoma-settings
      COVERAGE: "true"
      CI_ARTIFACTS: /home/runner/artifacts
      TEST_RESULTS: /home/runner/test-results
      PAGER: cat
    services:
      postgres:
        if: ${{ inputs.postgres }}
        image: cimg/postgres:17.9
        env:
          POSTGRES_USER: fatsoma
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fatsoma"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        if: ${{ inputs.rabbitmq }}
        image: rabbitmq:4.2.2-alpine
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        if: ${{ inputs.redis }}
        image: redis:3-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      elasticsearch:
        if: ${{ inputs.elasticsearch }}
        image: elasticsearch:5.6.10-alpine
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200/_cluster/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create private-gem token
        if: inputs.gem-allowlist != ''
        id: gem-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.FATSOMA_DEPENDENCIES_APP_PRIVATE_KEY }}
          owner: Fatsoma
          repositories: ${{ inputs.gem-allowlist }}
          permission-contents: read

      - name: Configure private gem access
        if: inputs.gem-allowlist != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.gem-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/Fatsoma/".insteadOf "git@github.com:Fatsoma/"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ inputs.ruby-version != '' && inputs.ruby-version || 'default' }}
          bundler-cache: true

      - name: Distribute settings env files
        shell: bash
        run: |
          mkdir -p "$CONFIG_PATH" "$CI_ARTIFACTS" "$TEST_RESULTS"
          # Skipped for callers that don't depend on fatsoma-settings
          # (v2-spec-helpers — the gem itself; discovery 008).
          if ! SETTINGS_DIR=$(bundle info --path fatsoma-settings 2>/dev/null); then
            echo "fatsoma-settings not in bundle; skipping settings distribution"
            exit 0
          fi
          for env in test development local; do
            cp -v "$SETTINGS_DIR/.env.circle" "$CONFIG_PATH/.env.$env"
          done

      # Service health is gated by the service container health checks above
      # (CircleCI used dockerize -wait with a 1m timeout per port).
      - name: Prepare database
        if: inputs.db-setup == 'structure-load'
        shell: bash
        run: RAILS_ENV=test bundle exec rake db:create db:structure:load

      - name: Prepare database (schema)
        if: inputs.db-setup == 'schema-load'
        shell: bash
        run: RAILS_ENV=test bundle exec rake db:schema:load

      - name: Prepare database (test-prepare)
        if: inputs.db-setup == 'test-prepare'
        shell: bash
        run: RAILS_ENV=test bundle exec rake db:test:prepare

      - name: Run specs
        shell: bash
        run: bundle exec rspec --format json --out $TEST_RESULTS/rspec/results.json --format documentation spec

      - name: Write coverage summary
        if: success()
        shell: bash
        run: |
          COVERED=$(ruby -rjson -e 'j = JSON.parse(File.read("coverage/.last_run.json")); puts j.dig("result", "covered_percent") || j.dig(:result, :covered_percent)' 2>/dev/null || echo "n/a")
          echo "total: **${COVERED}%**" >> "$GITHUB_STEP_SUMMARY"

      - name: Copy coverage report to artifacts
        if: always()
        shell: bash
        run: |
          if [ -d coverage ]; then
            mkdir -p "$CI_ARTIFACTS"
            cp -rv coverage "$CI_ARTIFACTS/coverage"
          fi

      - name: Show service logs on failure
        if: failure()
        shell: bash
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
          RABBITMQ_ID: ${{ job.services.rabbitmq.id }}
          REDIS_ID: ${{ job.services.redis.id }}
          ELASTICSEARCH_ID: ${{ job.services.elasticsearch.id }}
        run: |
          for id in $POSTGRES_ID $RABBITMQ_ID $REDIS_ID $ELASTICSEARCH_ID; do
            [ -n "$id" ] && docker logs "$id" || true
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: /home/runner/test-results/
          if-no-files-found: ignore

      - name: Upload coverage + artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage
          path: /home/runner/artifacts/
          if-no-files-found: ignore
