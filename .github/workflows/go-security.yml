name: Go Security

on:
  workflow_call:
    inputs:
      app-client-id:
        description: GitHub App client ID used to read private Go modules.
        required: true
        type: string
      module-allowlist:
        description: Newline-delimited private module repositories for the GitHub App token.
        required: true
        type: string
    secrets:
      FATSOMA_DEPENDENCIES_APP_PRIVATE_KEY:
        description: GitHub App private key used to read private Go modules.
        required: true

permissions:
  contents: read

jobs:
  security:
    name: Security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create private-module token
        id: module-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.FATSOMA_DEPENDENCIES_APP_PRIVATE_KEY }}
          owner: Fatsoma
          repositories: ${{ inputs.module-allowlist }}
          permission-contents: read

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.25.0
          cache: true

      - name: Configure private module access
        shell: bash
        env:
          GH_TOKEN: ${{ steps.module-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Download modules
        shell: bash
        env:
          GOPRIVATE: github.com/fatsoma/*
        run: go mod download

      - name: Run security scan
        id: security-report
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p coverage
          gosec="$RUNNER_TEMP/gosec"
          go -C tools/gosec build -o "$gosec" github.com/securego/gosec/v2/cmd/gosec
          "$gosec" -fmt=json -out=coverage/security-report.json ./...

      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-report
          path: coverage/security-report.json
          if-no-files-found: warn

      - name: Fail on security findings
        if: always() && steps.security-report.outcome == 'failure'
        shell: bash
        run: exit 1
