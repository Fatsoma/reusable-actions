name: Ruby Security

on:
  workflow_call:
    inputs:
      ruby-version:
        description: Ruby version for setup-ruby. Defaults to the caller's .ruby-version.
        required: false
        type: string
      app-client-id:
        description: GitHub App client ID used to read private gem repositories. Required only when gem-allowlist is set.
        required: false
        type: string
      gem-allowlist:
        description: Newline-delimited private gem repositories the GitHub App token may fetch. Omit for public-only Gemfiles — no token is created and no private access is configured.
        required: false
        type: string
    secrets:
      FATSOMA_DEPENDENCIES_APP_PRIVATE_KEY:
        description: GitHub App private key used to read private gem repositories. Required only when gem-allowlist is set.
        required: false
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM:
        description: Token for rubygems.pkg.github.com gem sources. Required only for Gemfiles sourcing from GitHub Packages.
        required: false

permissions:
  contents: read

jobs:
  security:
    name: Security
    runs-on: ubuntu-24.04
    env:
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.BUNDLE_RUBYGEMS__PKG__GITHUB__COM }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create private-gem token
        if: inputs.gem-allowlist != ''
        id: gem-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.FATSOMA_DEPENDENCIES_APP_PRIVATE_KEY }}
          owner: Fatsoma
          repositories: ${{ inputs.gem-allowlist }}
          permission-contents: read

      - name: Configure private gem access
        if: inputs.gem-allowlist != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.gem-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/Fatsoma/".insteadOf "git@github.com:Fatsoma/"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ inputs.ruby-version != '' && inputs.ruby-version || 'default' }}
          bundler-cache: true

      # Dependency CVE scanning is intentionally absent: Dependabot alerts are
      # enabled on the cohort and cover it (owner decision 2026-09-01).
      # bundler-audit duplicated that signal. Brakeman stays — Dependabot does
      # no static analysis of Rails app code.

      - name: Rails application check
        id: rails-check
        shell: bash
        run: |
          if [ -d app ]; then
            echo "rails_app=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Brakeman
        if: steps.rails-check.outputs.rails_app == 'true'
        shell: bash
        env:
          # Brakeman has dropped support for Ruby 2, so we need to use an older version until we upgrade Ruby
          BRAKEMAN_VERSION: ~> 5.0
        run: |
          mkdir -p artifacts
          echo "source 'https://rubygems.org'" > Gemfile.brakeman
          echo "gem 'brakeman', '$BRAKEMAN_VERSION'" >> Gemfile.brakeman
          bundle install --gemfile Gemfile.brakeman
          # EOLRails/EOLRuby are excluded: every cohort repo is on Rails 5.2 /
          # Ruby 2.7 (both EOL — known, tracked, and upgrade is a programme
          # outside CI migration scope). Without this, --exit-on-warn fails
          # every app-containing repo on exactly those two warnings
          # (cohort-governance discovery 011, first seen on v2-service-core).
          # All other checks keep gating.
          bundle exec --gemfile Gemfile.brakeman brakeman --exit-on-warn --except EOLRails,EOLRuby -o artifacts/brakeman.html

      - name: Skip notice
        if: steps.rails-check.outputs.rails_app != 'true'
        shell: bash
        run: echo "Not a Rails application — nothing to scan (dependency CVEs are covered by Dependabot)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-scan-results
          path: artifacts/
          if-no-files-found: ignore
