name: Ruby Integration (RabbitMQ)

on:
  workflow_call:
    inputs:
      ruby-version:
        description: Ruby version for setup-ruby. Defaults to the caller's .ruby-version.
        required: false
        type: string
      app-client-id:
        description: GitHub App client ID used to read private gem repositories. Required only when gem-allowlist is set.
        required: false
        type: string
      gem-allowlist:
        description: Newline-delimited private gem repositories the GitHub App token may fetch. Omit for public-only Gemfiles — no token is created and no private access is configured.
        required: false
        type: string
    secrets:
      FATSOMA_DEPENDENCIES_APP_PRIVATE_KEY:
        description: GitHub App private key used to read private gem repositories. Required only when gem-allowlist is set.
        required: false
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM:
        description: Token for rubygems.pkg.github.com gem sources. Required only for Gemfiles sourcing from GitHub Packages.
        required: false

permissions:
  contents: read

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-24.04
    env:
      BUNDLE_RUBYGEMS__PKG__GITHUB__COM: ${{ secrets.BUNDLE_RUBYGEMS__PKG__GITHUB__COM }}
      CONFIG_PATH: /home/runner/v2-fatsoma-settings
      COVERAGE: "true"
      INTEGRATION: "true"
      CI_ARTIFACTS: /home/runner/artifacts
      TEST_RESULTS: /home/runner/test-results
      PAGER: cat
      # Retry policy under test — mirrors the CircleCI integration job env.
      WORKERS_MESSAGE_QUEUE_RETRY_BASE: "1"
      WORKERS_MESSAGE_QUEUE_RETRY_MULTIPLIER: "2"
      WORKERS_MESSAGE_QUEUE_RETRY_LIMIT: "10"
    services:
      # Management variant (differs from the Go convention of plain
      # rabbitmq:4.2.2): broker configuration below uses the management HTTP
      # API on 15672. Health check makes GHA wait for the broker before steps
      # run (CircleCI used dockerize -wait tcp://localhost:5672).
      rabbitmq:
        image: rabbitmq:4.2.2-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create private-gem token
        if: inputs.gem-allowlist != ''
        id: gem-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.FATSOMA_DEPENDENCIES_APP_PRIVATE_KEY }}
          owner: Fatsoma
          repositories: ${{ inputs.gem-allowlist }}
          permission-contents: read

      - name: Configure private gem access
        if: inputs.gem-allowlist != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.gem-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/Fatsoma/".insteadOf "git@github.com:Fatsoma/"

      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: ${{ inputs.ruby-version != '' && inputs.ruby-version || 'default' }}
          bundler-cache: true

      - name: Distribute settings env files
        shell: bash
        run: |
          mkdir -p "$CONFIG_PATH" "$CI_ARTIFACTS" "$TEST_RESULTS"
          # Skipped for callers that don't depend on fatsoma-settings
          # (v2-spec-helpers — the gem itself; discovery 008).
          if ! SETTINGS_DIR=$(bundle info --path fatsoma-settings 2>/dev/null); then
            echo "fatsoma-settings not in bundle; skipping settings distribution"
            exit 0
          fi
          for env in test development local; do
            cp -v "$SETTINGS_DIR/.env.circle" "$CONFIG_PATH/.env.$env"
          done

      # Prescribed broker topology (not caller-configurable): the same setup
      # as `message_queue:configure` for the test environment in
      # v2-tools (docker/README.md "Create queues"), reimplemented over the
      # management HTTP API so CI does not depend on v2-tools/docker-tools.
      # Matches v2-queue's CircleCI config_rabbitmq.sh, minus the ha-mode
      # policies (meaningless on a single ephemeral node and rejected by
      # RabbitMQ 4.x), and with PUT-if-absent so reruns are idempotent.
      - name: Configure RabbitMQ broker
        shell: bash
        run: |
          set -euo pipefail
          API=http://localhost:15672/api
          AUTH="guest:guest"
          # PUT, retrying while the broker is still booting — the service
          # health check gates the AMQP port; the management API on 15672 can
          # answer 404/405 until the vhost is fully initialised.
          put() {
            for attempt in $(seq 1 12); do
              if curl -sf -u "$AUTH" -X PUT -H 'content-type: application/json' -d "$2" "$API/$1"; then
                return 0
              fi
              sleep 5
            done
            echo "failed to PUT $API/$1 after 60s" >&2
            return 1
          }
          # Bindings are POST-only on the management API (PUT → 405).
          post() {
            for attempt in $(seq 1 12); do
              if curl -sf -u "$AUTH" -X POST -H 'content-type: application/json' -d "$2" "$API/$1"; then
                return 0
              fi
              sleep 5
            done
            echo "failed to POST $API/$1 after 60s" >&2
            return 1
          }

          echo 'declaring main exchange'
          put 'exchanges/%2F/fatsoma_test' '{"type":"topic","durable":true}'

          echo 'declaring dead letter exchange'
          put 'exchanges/%2F/fatsoma_test_dlx' '{"type":"fanout","durable":true}'

          echo 'declaring retry queue'
          put 'queues/%2F/retry' '{"durable":true,"auto_delete":false}'

          echo 'declaring lazy retry policy'
          put 'policies/%2F/retry-lazy' '{"pattern":"^retry$","definition":{"queue-mode":"lazy"},"priority":0,"apply-to":"queues"}'

          echo 'declaring dead letter policy'
          put 'policies/%2F/dlx' '{"pattern":"^(api|service|user_interface)_","definition":{"dead-letter-exchange":"fatsoma_test_dlx"},"priority":0,"apply-to":"queues"}'

          echo 'declaring dead letter binding'
          post 'bindings/%2F/e/fatsoma_test_dlx/q/retry' '{"routing_key":"#"}'

          echo 'message queue configured for test'

      - name: Run specs
        shell: bash
        run: bundle exec rspec --format json --out $TEST_RESULTS/integration/results.json --format documentation spec

      - name: Write coverage summary
        if: success()
        shell: bash
        run: |
          COVERED=$(ruby -rjson -e 'j = JSON.parse(File.read("coverage/.last_run.json")); puts j.dig("result", "covered_percent") || j.dig(:result, :covered_percent)' 2>/dev/null || echo "n/a")
          echo "total: **${COVERED}%**" >> "$GITHUB_STEP_SUMMARY"

      - name: Copy coverage report to artifacts
        if: always()
        shell: bash
        run: |
          if [ -d coverage ]; then
            mkdir -p "$CI_ARTIFACTS"
            cp -rv coverage "$CI_ARTIFACTS/coverage"
          fi

      - name: Show RabbitMQ logs on failure
        if: failure()
        run: docker logs "${{ job.services.rabbitmq.id }}" || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-results
          path: /home/runner/test-results/
          if-no-files-found: ignore

      - name: Upload coverage + artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-coverage
          path: /home/runner/artifacts/
          if-no-files-found: ignore
