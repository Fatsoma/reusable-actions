name: Go Integration Redis

on:
  workflow_call:
    inputs:
      app-client-id:
        description: GitHub App client ID used to read private Go modules. Required only when module-allowlist is set.
        required: false
        type: string
      module-allowlist:
        description: Newline-delimited private module repositories for the GitHub App token. Omit for public-only repositories — no token is created and no private-module access is configured.
        required: false
        type: string
      env:
        description: Newline-delimited KEY=VALUE integration environment variables.
        default: ""
        required: false
        type: string
      translate:
        description: Merge goi18n translation files before the integration tests.
        default: false
        required: false
        type: boolean
      test-path:
        description: Package path for the integration tests.
        default: ./test/integration
        required: false
        type: string
    secrets:
      FATSOMA_DEPENDENCIES_APP_PRIVATE_KEY:
        description: GitHub App private key used to read private Go modules. Required only when module-allowlist is set.
        required: false

permissions:
  contents: read

jobs:
  integration:
    name: Integration
    runs-on: ubuntu-26.04
    services:
      redis:
        image: redis:6.2.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create private-module token
        if: inputs.module-allowlist != ''
        id: module-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ inputs.app-client-id }}
          private-key: ${{ secrets.FATSOMA_DEPENDENCIES_APP_PRIVATE_KEY }}
          owner: Fatsoma
          repositories: ${{ inputs.module-allowlist }}
          permission-contents: read

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure private module access
        if: inputs.module-allowlist != ''
        shell: bash
        env:
          GH_TOKEN: ${{ steps.module-token.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"

      - name: Download modules
        shell: bash
        env:
          GOPRIVATE: github.com/fatsoma/*
        run: go mod download

      - name: Use installed Go timezone data
        shell: bash
        run: echo "ZONEINFO=$(go env GOROOT)/lib/time/zoneinfo.zip" >> "$GITHUB_ENV"

      - name: Set integration environment
        shell: bash
        run: |
          cat <<'EOF' >> "$GITHUB_ENV"
          ${{ inputs.env }}
          EOF

      - name: Merge translations
        if: inputs.translate
        shell: bash
        run: |
          rm -f configs/locales/en-gb.all.json
          go tool goi18n merge -sourceLanguage en-GB -format json -outdir configs/locales configs/locales/en-gb.*.json

      - name: Run integration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          go test -json -tags integration "${{ inputs.test-path }}" | tee test-results/go-integration-test.json

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-results
          path: test-results
          if-no-files-found: warn

      - name: Show Redis logs on failure
        if: failure()
        run: docker logs "${{ job.services.redis.id }}"
